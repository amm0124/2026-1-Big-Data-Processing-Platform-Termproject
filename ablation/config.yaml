data:
  raw_dir: ../data/idsse-data
  processed_file: ./processed/sequences.npy

model:
  hidden_size: 128
  num_layers: 2
  window: 10          # retained frames used as context (5 before + 5 after)

train:
  lr: 0.001
  epochs: 50
  batch_size: 512
  train_ratio: 0.7
  val_ratio: 0.1      # remaining 0.2 is test

output:
  model_path: ./model.pth
  results_path: ./results.txt
